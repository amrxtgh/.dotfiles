source = /home/amrxtgh/.config/hypr/current_theme.conf
general {
  ignore_empty_input = true
  no_fade_in = true
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

label {
  text = $LAYOUT
  font_family = Adwaita Sans
  shadow_passes = 1
  shadow_size = 2

  position = 0, -80
  halign = center
  valign = center
}

background {
  monitor =
  path = /home/amrxtgh/Downloads/pics/wallpaper.jpg
  blur_passes = 3
}

animations {
    enabled = false
}
