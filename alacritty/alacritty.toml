import = ["~/.dotfiles/alacritty/mac_black.toml"]

[terminal.shell]
program = "/usr/bin/zsh"
args = ["--login"]

[window]
opacity = 0.9
blur = true
dynamic_title = true
startup_mode = "Windowed"
decorations = "None"
padding = { x = 12, y = 12 }
position = { x = 100, y = 100 }

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 10

[cursor]
style = "Block"
unfocused_hollow = true

[[keyboard.bindings]]
key = "T"
mods = "Control|Alt"
action = "SpawnNewInstance"

[mouse]
hide_when_typing = true

