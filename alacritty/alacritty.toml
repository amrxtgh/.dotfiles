# Import catppuccin mocha theme
import = ["~/.dotfiles/alacritty/catppuccin-mocha.toml"]

[terminal.shell]
program = "/usr/bin/zsh"
args = ["--login"]

[window]
opacity = 0.95
blur = true
dynamic_title = true
startup_mode = "Windowed"
decorations = "None"
padding = { x = 12, y = 12 }
position = { x = 100, y = 100 }

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[cursor]
style = "Block"
unfocused_hollow = true

[[keyboard.bindings]]
key = "T"
mods = "Control|Alt"
action = "SpawnNewInstance"

[mouse]
hide_when_typing = true

